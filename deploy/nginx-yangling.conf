# 养令 YangLing · 网页版(含管理后台)静态站点
server {
    listen 80;
    listen [::]:80;
    server_name yangling.entermodetwo.com;

    # Let's Encrypt 续期验证目录
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yangling;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yangling.entermodetwo.com;

    ssl_certificate /etc/letsencrypt/live/yangling.entermodetwo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yangling.entermodetwo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/yangling;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/yangling.entermodetwo.com.access.log;
    error_log /var/log/nginx/yangling.entermodetwo.com.error.log warn;

    # SPA 路由回退:深链刷新/直达不 404
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 推送服务器反代:HTTPS 页面通过 /push/ 访问本地 8788(避免混合内容)
    location /push/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 构建产物长缓存(文件名带 hash)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # MediaPipe 模型/wasm 长缓存
    location ~* \.(wasm|model|tflite)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
}
